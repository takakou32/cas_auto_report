<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>練習システム(SPA版) - 証明書発行</title>
<link rel="stylesheet" href="mock.css">
</head>
<body>
<h1>練習システム（SPA版）</h1>
<p class="tool">画面遷移を pushState で行う版。リロードせずURLだけが変わる。</p>

<div class="screen" id="screen-menu" style="display:none">
  <h2>メニュー</h2>
  <ul class="menu-list">
    <li class="menu-item"><a href="#/search" id="link-shomei-spa">証明書発行</a></li>
  </ul>
</div>

<div class="screen" id="screen-search" style="display:none">
  <h2>対象者検索</h2>
  <p>
    <label for="input-atena">宛名番号</label>
    <input type="text" id="input-atena" placeholder="宛名番号">
    <button id="btn-search">検索</button>
  </p>
</div>

<div class="screen" id="screen-result" style="display:none">
  <h2>検索結果</h2>
  <ul class="result-list" id="result-list"></ul>
  <p class="empty" id="result-empty" style="display:none">該当する対象者はいません</p>
</div>

<div class="screen" id="screen-print" style="display:none">
  <h2>印字項目の選択</h2>
  <p>対象者: <span id="print-target"></span></p>
  <div class="items">
    <label><input type="checkbox" id="chk-setai"> 世帯主</label>
    <label><input type="checkbox" id="chk-zokugara"> 続柄</label>
    <label><input type="checkbox" id="chk-honseki"> 本籍</label>
    <label><input type="checkbox" id="chk-mynumber"> 個人番号</label>
  </div>
  <p><button id="btn-issue">発行</button></p>
  <div id="confirm-dialog" style="display:none">
    <p>この内容で帳票を発行します。よろしいですか？</p>
    <p><button id="btn-confirm-yes">はい</button> <button id="btn-confirm-no">いいえ</button></p>
  </div>
</div>

<h2>発行済みリスト</h2>
<div id="issued-box"></div>

<script src="mock.js"></script>
<script>
// 画面の状態はアプリ側（sessionStorage）が持つ。URLは「どの画面か」しか表さない。
// 実際の業務システムのSPAも、選択中の対象者はサーバ側セッションかアプリの内部状態で持つ。
function stateGet(k) { try { return sessionStorage.getItem(k) || ""; } catch (e) { return ""; } }
function stateSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }

function go(hash) {
  history.pushState({}, "", hash);
  render();
}

function render() {
  var h = location.hash || "#/menu";
  var ids = ["screen-menu", "screen-search", "screen-result", "screen-print"];
  var map = { "#/menu": "screen-menu", "#/search": "screen-search", "#/result": "screen-result", "#/print": "screen-print" };
  var show = map[h] || "screen-menu";
  for (var i = 0; i < ids.length; i++) {
    document.getElementById(ids[i]).style.display = (ids[i] === show) ? "" : "none";
  }
  document.getElementById("confirm-dialog").style.display = "none";
  if (show === "screen-result") { renderResult(); }
  if (show === "screen-print")  { renderPrint(); }
}

function renderResult() {
  var q = stateGet("spa_query");
  var list = document.getElementById("result-list");
  var empty = document.getElementById("result-empty");
  list.innerHTML = "";
  if (q && MOCK_DB[q]) {
    var li = document.createElement("li");
    li.className = "result-row";
    li.setAttribute("data-atena", q);
    li.textContent = q + " " + MOCK_DB[q];
    li.addEventListener("click", function () { stateSet("spa_atena", q); go("#/print"); });
    list.appendChild(li);
    empty.style.display = "none";
  } else {
    empty.style.display = "";
  }
}

function renderPrint() {
  var a = stateGet("spa_atena");
  document.getElementById("print-target").textContent = (a && MOCK_DB[a]) ? (a + " " + MOCK_DB[a]) : "(未選択)";
  var init = a ? mockInitialChecks(a) : {};
  for (var i = 0; i < MOCK_ITEMS.length; i++) {
    var it = MOCK_ITEMS[i];
    document.getElementById(it.id).checked = !!init[it.id];
  }
}

document.getElementById("link-shomei-spa").addEventListener("click", function (e) {
  e.preventDefault();
  go("#/search");
});

document.getElementById("btn-search").addEventListener("click", function () {
  stateSet("spa_query", document.getElementById("input-atena").value.trim());
  go("#/result");
});

// 発行ボタンは確認ダイアログを出すだけ（実際の出力は「はい」）
document.getElementById("btn-issue").addEventListener("click", function () {
  var a = stateGet("spa_atena");
  if (!a || !MOCK_DB[a]) { return; }
  document.getElementById("confirm-dialog").style.display = "";
});

document.getElementById("btn-confirm-no").addEventListener("click", function () {
  document.getElementById("confirm-dialog").style.display = "none";
});

// 「はい」で発行（帳票出力の代用）
document.getElementById("btn-confirm-yes").addEventListener("click", function () {
  var a = stateGet("spa_atena");
  if (!a || !MOCK_DB[a]) { return; }
  var items = {};
  for (var i = 0; i < MOCK_ITEMS.length; i++) {
    items[MOCK_ITEMS[i].id] = document.getElementById(MOCK_ITEMS[i].id).checked;
  }
  var list = mockLoadIssued();
  list.push({ atena: a, name: MOCK_DB[a], items: items, ts: new Date().toISOString() });
  mockSaveIssued(list);
  mockRenderIssued(document.getElementById("issued-box"));
  document.getElementById("confirm-dialog").style.display = "none";
  document.getElementById("input-atena").value = "";
  stateSet("spa_atena", "");
  stateSet("spa_query", "");
  go("#/menu");
});

window.addEventListener("popstate", render);
window.addEventListener("hashchange", render);
if (!location.hash) { history.replaceState({}, "", "#/menu"); }
render();
mockRenderIssued(document.getElementById("issued-box"));
</script>
</body>
</html>
