<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>練習システム - 証明書発行（氏名だけの一覧）</title>
<link rel="stylesheet" href="mock.css">
</head>
<body>
<h1>証明書発行（氏名だけの一覧）</h1>

<!-- 本物の業務システムと同じ条件にした画面。
     ・対象者一覧の行に宛名番号を出さない（氏名だけ）
     ・行に宛名番号を含む属性を持たせない
     ・選択後の画面にも宛名番号を出さない
     この条件だと、記録したボタン名（氏名）での照合は2人目以降で必ず外れる。 -->

<div class="screen" id="screen-search">
  <h2>対象者検索</h2>
  <p>
    <label for="input-atena">宛名番号</label>
    <input type="text" id="input-atena" placeholder="宛名番号">
    <button id="btn-search">検索</button>
  </p>
</div>

<div class="screen" id="screen-result" style="display:none">
  <h2>検索結果</h2>
  <!-- 実環境（PrimeVue系）に合わせ、行は tr.p-selectable-row。表示は氏名だけ -->
  <table class="p-datatable" id="result-table">
    <thead><tr><th>氏名</th></tr></thead>
    <tbody id="result-body"></tbody>
  </table>
  <p class="empty" id="result-empty" style="display:none">該当する対象者はいません</p>
</div>

<div class="screen" id="screen-print" style="display:none">
  <h2>印字項目の選択</h2>
  <!-- 選択後の画面にも宛名番号は出さない（実環境と同じ） -->
  <p>対象者: <span id="print-target"></span></p>
  <div class="items">
    <label><input type="checkbox" id="chk-setai"> 世帯主</label>
    <label><input type="checkbox" id="chk-zokugara"> 続柄</label>
    <label><input type="checkbox" id="chk-honseki"> 本籍</label>
    <label><input type="checkbox" id="chk-mynumber"> 個人番号</label>
  </div>
  <p><button id="btn-issue">発行</button></p>
  <div id="confirm-dialog" style="display:none">
    <p>この内容で帳票を発行します。よろしいですか？</p>
    <p><button id="btn-confirm-yes">はい</button> <button id="btn-confirm-no">いいえ</button></p>
  </div>
</div>

<h2>発行済みリスト</h2>
<div id="issued-box"></div>

<script src="mock.js"></script>
<script>
// 選択中の対象者（画面3で行をクリックすると確定する）
var selected = null;

function showScreen(id) {
  var ids = ["screen-search", "screen-result", "screen-print"];
  for (var i = 0; i < ids.length; i++) {
    document.getElementById(ids[i]).style.display = (ids[i] === id) ? "" : "none";
  }
}

// 一覧に1行足す。宛名番号は画面に出さず、行の属性にも持たせない（クロージャで内側だけが知っている）
function addRow(atena) {
  var tr = document.createElement("tr");
  tr.className = "p-selectable-row";
  tr.setAttribute("tabindex", "0");
  var td = document.createElement("td");
  td.textContent = MOCK_DB[atena];
  tr.appendChild(td);
  tr.addEventListener("click", function () { selectTarget(atena); });
  document.getElementById("result-body").appendChild(tr);
}

// 画面2 → 画面3（検索）。URLは変えない＝業務システムのポストバックを模す
function doSearch() {
  var atena = document.getElementById("input-atena").value.trim();
  var body = document.getElementById("result-body");
  var empty = document.getElementById("result-empty");
  body.innerHTML = "";
  selected = null;
  if (mockMulti()) {
    // 検証用スイッチ。同姓同名・あいまい検索などで一覧が複数件になる状態を作る
    for (var k in MOCK_DB) { addRow(k); }
    empty.style.display = "none";
  } else if (MOCK_DB[atena]) {
    addRow(atena);
    empty.style.display = "none";
  } else {
    empty.style.display = "";
  }
  showScreen("screen-result");
}

document.getElementById("btn-search").addEventListener("click", doSearch);

// 画面3 → 画面4（対象者の確定）。印字項目の初期状態は対象者ごとに変わる
function selectTarget(atena) {
  selected = { atena: atena, name: MOCK_DB[atena] };
  document.getElementById("print-target").textContent = MOCK_DB[atena];
  var init = mockInitialChecks(atena);
  for (var i = 0; i < MOCK_ITEMS.length; i++) {
    var it = MOCK_ITEMS[i];
    document.getElementById(it.id).checked = !!init[it.id];
  }
  showScreen("screen-print");
}

// 発行ボタンは確認ダイアログを出すだけ（実際の出力は「はい」）
document.getElementById("btn-issue").addEventListener("click", function () {
  if (!selected) { return; }
  document.getElementById("confirm-dialog").style.display = "";
});

document.getElementById("btn-confirm-no").addEventListener("click", function () {
  document.getElementById("confirm-dialog").style.display = "none";
});

// 「はい」で発行（帳票出力の代用）。
// 帳票はサーバ側に溜まる想定なので、誰の帳票かが分かるよう宛名番号と氏名を記録する
// （画面には出さないが、出力物には載っている、という実環境と同じ関係）
document.getElementById("btn-confirm-yes").addEventListener("click", function () {
  if (!selected) { return; }
  var items = {};
  for (var i = 0; i < MOCK_ITEMS.length; i++) {
    items[MOCK_ITEMS[i].id] = document.getElementById(MOCK_ITEMS[i].id).checked;
  }
  var list = mockLoadIssued();
  list.push({ atena: selected.atena, name: selected.name, items: items, ts: new Date().toISOString() });
  mockSaveIssued(list);
  mockRenderIssued(document.getElementById("issued-box"));
  selected = null;
  document.getElementById("confirm-dialog").style.display = "none";
  document.getElementById("input-atena").value = "";
  showScreen("screen-search");
});

mockRenderIssued(document.getElementById("issued-box"));
</script>
</body>
</html>
